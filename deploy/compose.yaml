services:
  gameshud-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: gameshud-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Docker__Endpoint: ${GAMESHUD_DOCKER_ENDPOINT:-unix:///var/run/docker.sock}
      Metrics__SnapshotIntervalSeconds: ${GAMESHUD_METRICS_SNAPSHOT_INTERVAL_SECONDS:-60}
      Metrics__RetentionHours: ${GAMESHUD_METRICS_RETENTION_HOURS:-24}
      Metrics__HostDiskPath: ${GAMESHUD_METRICS_HOST_DISK_PATH:-/}
      Notifications__Discord__WebhookUrl: ${GAMESHUD_DISCORD_WEBHOOK_URL:-}
      Notifications__Discord__CooldownSeconds: ${GAMESHUD_DISCORD_COOLDOWN_SECONDS:-60}
      Notifications__Discord__Events__ServerStatus: ${GAMESHUD_DISCORD_EVENT_SERVER_STATUS:-true}
      Notifications__Discord__Events__Backups: ${GAMESHUD_DISCORD_EVENT_BACKUPS:-true}
      Notifications__Discord__Events__Updates: ${GAMESHUD_DISCORD_EVENT_UPDATES:-true}
      Notifications__Discord__Events__PlayerJoinLeave: ${GAMESHUD_DISCORD_EVENT_PLAYER_JOIN_LEAVE:-false}
      Operations__Palworld__LifecycleTimeoutSeconds: ${GAMESHUD_SCHEDULER_PALWORLD_LIFECYCLE_TIMEOUT_SECONDS:-30}
      Operations__Palworld__RestartWaitSeconds: ${GAMESHUD_SCHEDULER_PALWORLD_RESTART_WAIT_SECONDS:-60}
      Operations__Palworld__RestartWarningMinutes__0: ${GAMESHUD_SCHEDULER_PALWORLD_RESTART_WARNING_0:-10}
      Operations__Palworld__RestartWarningMinutes__1: ${GAMESHUD_SCHEDULER_PALWORLD_RESTART_WARNING_1:-5}
      Operations__Palworld__RestartWarningMinutes__2: ${GAMESHUD_SCHEDULER_PALWORLD_RESTART_WARNING_2:-1}
      Palworld__ManagedPath: /managed/palworld
      Palworld__BackupPath: /managed/palworld-backups
      Palworld__ContainerName: ${GAMESHUD_PALWORLD_CONTAINER:-palworld-server-example}
      Palworld__ConnectionAddress: ${GAMESHUD_PALWORLD_CONNECTION_ADDRESS:-}
      Palworld__Backups__AutomaticEnabled: ${GAMESHUD_PALWORLD_BACKUPS_AUTOMATIC_ENABLED:-false}
      Palworld__Backups__AutomaticIntervalMinutes: ${GAMESHUD_PALWORLD_BACKUPS_AUTOMATIC_INTERVAL_MINUTES:-360}
      Palworld__Backups__RetentionCount: ${GAMESHUD_PALWORLD_BACKUPS_RETENTION_COUNT:-24}
      Palworld__Backups__RetentionDays: ${GAMESHUD_PALWORLD_BACKUPS_RETENTION_DAYS:-7}
      Palworld__Backups__PreBackupSaveDelaySeconds: ${GAMESHUD_PALWORLD_BACKUPS_PRE_SAVE_DELAY_SECONDS:-2}
      Palworld__Backups__LifecycleTimeoutSeconds: ${GAMESHUD_PALWORLD_BACKUPS_LIFECYCLE_TIMEOUT_SECONDS:-30}
      Palworld__RestApi__BaseUrl: ${GAMESHUD_PALWORLD_REST_BASE_URL:-}
      Palworld__RestApi__Username: ${GAMESHUD_PALWORLD_REST_USERNAME:-}
      Palworld__RestApi__Password: ${GAMESHUD_PALWORLD_REST_PASSWORD:-}
      Palworld__RestApi__TimeoutSeconds: ${GAMESHUD_PALWORLD_REST_TIMEOUT_SECONDS:-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GAMESHUD_PALWORLD_PATH:-./palworld-data}:/managed/palworld
      - ${GAMESHUD_PALWORLD_BACKUP_PATH:-./palworld-backups}:/managed/palworld-backups
    expose:
      - "8080"
    restart: unless-stopped

  gameshud-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: gameshud-frontend:local
    depends_on:
      - gameshud-api
    ports:
      - "127.0.0.1:${GAMESHUD_FRONTEND_PORT:-8088}:80"
    restart: unless-stopped
