services:
  gameshud-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: gameshud-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Docker__Endpoint: ${GAMESHUD_DOCKER_ENDPOINT:-unix:///var/run/docker.sock}
      Palworld__ManagedPath: /managed/palworld
      Palworld__ContainerName: ${GAMESHUD_PALWORLD_CONTAINER:-palworld-server-example}
      Palworld__ConnectionAddress: ${GAMESHUD_PALWORLD_CONNECTION_ADDRESS:-}
      Palworld__RestApi__BaseUrl: ${GAMESHUD_PALWORLD_REST_BASE_URL:-}
      Palworld__RestApi__Username: ${GAMESHUD_PALWORLD_REST_USERNAME:-}
      Palworld__RestApi__Password: ${GAMESHUD_PALWORLD_REST_PASSWORD:-}
      Palworld__RestApi__TimeoutSeconds: ${GAMESHUD_PALWORLD_REST_TIMEOUT_SECONDS:-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GAMESHUD_PALWORLD_PATH:-./palworld-data}:/managed/palworld
    expose:
      - "8080"
    restart: unless-stopped

  gameshud-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: gameshud-frontend:local
    depends_on:
      - gameshud-api
    ports:
      - "127.0.0.1:${GAMESHUD_FRONTEND_PORT:-8088}:80"
    restart: unless-stopped
